<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>소중한 사람에게</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hi+Melody&family=Poor+Story&family=Single+Day&display=swap"
          rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family: sans-serif;
            background: #fff;
            color: #333;
            text-align: center;
        }

        /* ==========================================
           1. INTRO — 강렬한 애니메이션 적용
           ========================================== */
        .intro {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            background: #000; /* 시작은 완전 검정 */
            color: white;
        }

        /* ✅ 배경사진: 나중에 서서히 나타남 */
        .intro__bg {
            position: absolute;
            inset: 0;
            background-image: url('images/bg1.jpg');
            background-size: cover;
            background-position: center;
            opacity: 0;
            animation: bgFadeIn 2.5s ease-out 1.5s forwards;
            transform: scale(1.1);
        }
        @keyframes bgFadeIn {
            to {
                opacity: 0.85; /* 약간 투명하게 */
                transform: scale(1);
            }
        }

        /* ✅ 어두운 오버레이: 점차 사라짐 */
        .intro__overlay {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 60%,
                rgba(90, 40, 60, 0.6),
                rgba(10, 10, 30, 0.9) 70%);
            animation: overlayFade 3s ease-out forwards;
        }
        @keyframes overlayFade {
            0% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        /* ✅ 빛나는 별/입자 효과 */
        .intro__stars {
            position: absolute;
            inset: 0;
            overflow: hidden;
        }
        .star {
            position: absolute;
            width: 3px;
            height: 3px;
            background: white;
            border-radius: 50%;
            opacity: 0;
            animation: twinkle 3s ease-in-out infinite;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0; transform: scale(0.5); }
            50%      { opacity: 1; transform: scale(1.2); }
        }

        /* ✅ 중앙 따뜻한 빛 구체 */
        .intro__glow {
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle,
                rgba(255, 160, 100, 0.45),
                transparent 70%);
            filter: blur(80px);
            bottom: -300px;
            animation: pulseGlow 4s ease-in-out infinite alternate;
            opacity: 0;
            animation: pulseGlow 4s ease-in-out infinite alternate, glowAppear 2s ease-out 1s forwards;
        }
        @keyframes pulseGlow {
            from { transform: scale(0.8); opacity: 0.4; }
            to   { transform: scale(1.2); opacity: 0.7; }
        }
        @keyframes glowAppear {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        /* ✅ 텍스트 콘텐츠 */
        .intro-content {
            position: relative;
            z-index: 10;
            padding: 20px;
        }

        .intro-small {
            font-size: 1.1rem;
            letter-spacing: 8px;
            text-transform: uppercase;
            opacity: 0;
            animation: slideUp 1.2s ease-out 0.3s forwards;
        }

        .intro h1 {
            font-family: "Hi Melody", sans-serif;
            font-size: clamp(3.2rem, 9vw, 7.5rem);
            line-height: 1.25;
            margin: 20px 0;
            opacity: 0;
            animation: slideUp 1.4s ease-out 0.6s forwards,
                       textGlow 2.5s ease-in-out 1s infinite alternate;
        }

        .intro p {
            font-size: 1.25rem;
            letter-spacing: 3px;
            opacity: 0;
            animation: slideUp 1.4s ease-out 0.9s forwards;
        }

        .start-btn {
            margin-top: 50px;
            padding: 16px 60px;
            border: 1px solid rgba(255,255,255,.5);
            border-radius: 50px;
            background: rgba(255,255,255,.08);
            color: white;
            font-size: 1.05rem;
            letter-spacing: 2px;
            cursor: pointer;
            opacity: 0;
            transform: translateY(30px);
            animation: slideUp 1.4s ease-out 1.3s forwards,
                       btnPulse 2s ease-in-out 2s infinite;
            transition: all .4s ease;
            backdrop-filter: blur(6px);
        }

        .start-btn:hover {
            background: rgba(255,255,255,.2);
            border-color: white;
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 0 30px rgba(255, 180, 120, 0.4);
        }

        /* ✅ 공통 애니메이션 키프레임 */
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @keyframes textGlow {
            from {
                text-shadow:
                    0 0 10px rgba(255,255,255,.3),
                    0 0 25px rgba(255,150,150,.2);
            }
            to {
                text-shadow:
                    0 0 15px rgba(255,255,255,.5),
                    0 0 40px rgba(255,180,120,.4),
                    0 0 60px rgba(255,120,120,.2);
            }
        }
        @keyframes btnPulse {
            0%, 100% { box-shadow: 0 0 0 rgba(255,255,255,0); }
            50%      { box-shadow: 0 0 15px rgba(255,180,120,.35); }
        }

        /* =========================
           공통 섹션
           ========================= */
        .section {
            min-height: 100vh;
            padding: 100px 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .section-content {
            position: relative;
            z-index: 2;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .section-title {
            font-family: "Hi Melody", sans-serif;
            font-size: 3rem;
            margin-bottom: 10px;
            text-align: center;
        }

        .section-subtitle {
            color: #888;
            margin-bottom: 50px;
            text-align: center;
        }

        /* =========================
           2. 카드 선택
           ========================= */
        #cards-section {
            background-image: url('images/bg2.jpg');
            background-size: cover;
            background-position: center;
        }

        #cards-section::before {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.75);
            z-index: 1;
        }

        .cards {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .card {
            width: 240px;
            height: 330px;
            border-radius: 20px;
            overflow: hidden;
            cursor: pointer;
            background: white;
            box-shadow: 0 10px 30px rgba(0,0,0,.12);
            transition: .4s;
            position: relative;
        }

        .card:hover {
            transform: translateY(-15px) rotate(-1deg);
            box-shadow: 0 20px 40px rgba(0,0,0,.2);
        }

        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .card-text {
            height: 130px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 0 10px;
        }

        .card.love h3    { font-family: "Single Day", cursive; }
        .card.sorry h3   { font-family: "Poor Story", system-ui; }
        .card.thanks h3  { font-family: "Hi Melody", sans-serif; }

        .card-text h3 {
            margin: 0;
            font-size: 2rem;
            text-align: center;
        }

        .card-text p {
            margin: 5px;
            color: #999;
            font-size: 0.95rem;
            text-align: center;
        }

        /* =========================
           3. 폰트 선택
           ========================= */
        #font-section {
            background-image: url('images/bg3.jpg');
            background-size: cover;
            background-position: center;
        }

        #font-section::before {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.75);
            z-index: 1;
        }

        .font-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            width: 100%;
        }

        .font-choice { position: relative; }
        .font-choice input { display: none; }

        .font-choice label {
            display: block;
            width: 300px;
            padding: 20px;
            border-radius: 15px;
            background: white;
            border: 2px solid transparent;
            text-align: center;
            cursor: pointer;
            font-size: 1.8rem;
            box-shadow: 0 5px 20px rgba(0,0,0,.08);
            transition: .3s;
        }

        .font-choice label:hover { transform: scale(1.03); }

        #hi + label      { font-family: "Hi Melody", sans-serif; }
        #single + label  { font-family: "Single Day", cursive; }
        #poor + label    { font-family: "Poor Story", system-ui; }

        #hi:checked + label,
        #single:checked + label,
        #poor:checked + label {
            border-color: #e56b7f;
            background: #fff0f3;
        }

        /* =========================
           4. 메시지 작성
           ========================= */
        #message-section {
            background-image: url('images/bg4.jpg');
            background-size: cover;
            background-position: center;
        }

        #message-section::before {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.75);
            z-index: 1;
        }

        .message-box {
            width: min(700px, 90%);
            padding: 40px;
            background: rgba(255,255,255,.85);
            border-radius: 25px;
            box-shadow: 0 20px 50px rgba(0,0,0,.1);
            text-align: center;
        }

        .message-box textarea {
            width: 100%;
            height: 250px;
            resize: none;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 15px;
            font-size: 1.3rem;
            outline: none;
            text-align: left;
            transition: font-family 0.3s ease;
        }

        .message-box textarea:focus {
            border-color: #e56b7f;
            box-shadow: 0 0 10px rgba(229,107,127,.2);
        }

        .send-btn {
            width: 100%;
            margin-top: 20px;
            padding: 17px;
            border: none;
            border-radius: 50px;
            background: #df687b;
            color: white;
            font-size: 1.1rem;
            cursor: pointer;
            transition: .3s;
        }

        .send-btn:hover {
            background: #c94d63;
            transform: translateY(-2px);
        }

        /* =========================
           5. 완료 화면
           ========================= */
        #complete {
            display: none;
            min-height: 100vh;
            background-image: url('images/bg5.jpg');
            background-size: cover;
            background-position: center;
            color: white;
            text-align: center;
            position: relative;
            overflow: hidden;
            align-items: center;
            justify-content: center;
        }

        #complete::before {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            z-index: 1;
        }

        #complete > div {
            position: relative;
            z-index: 2;
            text-align: center;
        }

        #complete h2 {
            font-family: "Hi Melody", sans-serif;
            font-size: 4rem;
            animation: complete 1.5s ease;
            text-align: center;
        }

        @keyframes complete {
            from { opacity: 0; transform: scale(.5); }
            to { opacity: 1; transform: scale(1); }
        }

        .heart {
            font-size: 5rem;
            animation: heartbeat 1s infinite;
            text-align: center;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        .home-btn {
            margin-top: 40px;
            padding: 15px 40px;
            border-radius: 50px;
            border: 1px solid white;
            background: transparent;
            color: white;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <!-- ==========================================
        INTRO — 애니메이션 강화
        ========================================== -->
    <section class="intro" id="intro">
        <!-- 별 빛 효과 -->
        <div class="intro__stars" id="stars"></div>

        <!-- 배경사진: 나중에 나타남 -->
        <div class="intro__bg"></div>

        <!-- 어두운 오버레이 -->
        <div class="intro__overlay"></div>

        <!-- 따뜻한 빛 구체 -->
        <div class="intro__glow"></div>

        <!-- 텍스트 내용 -->
        <div class="intro-content">
            <div class="intro-small">FOR SOMEONE SPECIAL</div>
            <h1>인생의 가장<br>소중한 사람에게</h1>
            <p>전하지 못했던 마음을<br>지금 전해보세요.</p>
            <button class="start-btn" onclick="goToCards()">마음 전하기</button>
        </div>
    </section>

    <!-- 카드 선택 -->
    <section class="section" id="cards-section">
        <div class="section-content">
            <div class="section-title">어떤 마음을 전할까요?</div>
            <div class="section-subtitle">당신의 마음과 가장 가까운 카드를 선택해주세요.</div>
            <div class="cards">
                <div class="card love" onclick="selectCard('사랑해')">
                    <img src="images/love.jpg" alt="사랑해 카드 이미지">
                    <div class="card-text">
                        <h3>사랑해</h3>
                        <p>당신을 사랑하는 마음</p>
                    </div>
                </div>
                <div class="card sorry" onclick="selectCard('미안해')">
                    <img src="images/sorry.jpg" alt="미안해 카드 이미지">
                    <div class="card-text">
                        <h3>미안해</h3>
                        <p>전하지 못했던 사과</p>
                    </div>
                </div>
                <div class="card thanks" onclick="selectCard('고마워')">
                    <img src="images/thanks.jpg" alt="고마워 카드 이미지">
                    <div class="card-text">
                        <h3>고마워</h3>
                        <p>전하고 싶은 감사</p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- 폰트 선택 -->
    <section class="section" id="font-section">
        <div class="section-content">
            <div class="section-title">마음을 담을 글씨체</div>
            <div class="section-subtitle">원하는 폰트를 선택해주세요.</div>
            <div class="font-box">
                <div class="font-choice">
                    <input type="radio" name="font" id="hi" data-font="Hi Melody">
                    <label for="hi">고마워</label>
                </div>
                <div class="font-choice">
                    <input type="radio" name="font" id="single" data-font="Single Day">
                    <label for="single">사랑해</label>
                </div>
                <div class="font-choice">
                    <input type="radio" name="font" id="poor" data-font="Poor Story">
                    <label for="poor">미안해</label>
                </div>
            </div>
        </div>
    </section>

    <!-- 메시지 작성 -->
    <section class="section" id="message-section">
        <div class="section-content">
            <div class="section-title">이제 마음을 전해보세요.</div>
            <div class="section-subtitle">소중한 사람에게 하고 싶은 말을 적어주세요.</div>
            <div class="message-box">
                <textarea id="msg" maxlength="500" placeholder="전하고 싶은 말을 적어주세요..."></textarea>
                <button class="send-btn" onclick="sendMessage()">💌 메시지 보내기</button>
            </div>
        </div>
    </section>

    <!-- 완료 -->
    <section id="complete">
        <div>
            <div class="heart">💌</div>
            <h2>메시지가 보내졌습니다.</h2>
            <p>당신의 마음이<br>소중한 사람에게 잘 전달되기를 바랍니다.</p>
            <button class="home-btn" onclick="location.reload()">처음으로</button>
        </div>
    </section>

    <script>
        // ✅ 별 빛 자동 생성
        const starsContainer = document.getElementById('stars');
        for (let i = 0; i < 60; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            star.style.left = `${Math.random() * 100}%`;
            star.style.top = `${Math.random() * 100}%`;
            star.style.animationDelay = `${Math.random() * 3}s`;
            star.style.width = star.style.height = `${Math.random() * 2 + 1}px`;
            starsContainer.appendChild(star);
        }

        let selectedCard = "";
        function selectCard(card) {
            selectedCard = card;
            document.getElementById("font-section").scrollIntoView({ behavior: "smooth" });
        }
        function goToCards() {
            document.getElementById("cards-section").scrollIntoView({ behavior: "smooth" });
        }

        const fontInputs = document.querySelectorAll('input[name="font"]');
        const msgTextarea = document.getElementById("msg");
        fontInputs.forEach(input => {
            input.addEventListener("change", () => {
                if (input.checked) {
                    msgTextarea.style.fontFamily = input.dataset.font;
                    document.getElementById("message-section").scrollIntoView({ behavior: "smooth" });
                }
            });
        });

        function sendMessage() {
            const message = document.getElementById("msg").value;
            if (message.trim() === "") {
                alert("메시지를 입력해주세요.");
                return;
            }
            document.querySelectorAll(".section").forEach(s => s.style.display = "none");
            document.getElementById("intro").style.display = "none";
            document.getElementById("complete").style.display = "flex";
        }
    </script>
</body>
</html>
